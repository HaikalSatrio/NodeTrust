name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned to full commit SHAs (tags are mutable), looked up 26 Sep 2026. Newer majors exist
# (checkout v7, setup-python v7); upgrade deliberately, SHA and comment together.
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nodetrust-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Quality gate (compile, lint, tests, e2e with nodetrust-ci, secret scan, dashboard CSP, pins)
        env:
          NODETRUST_REQUIRE_LINT: "1"
        run: python scripts/check.py

  ci-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nodetrust-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyflakes
      - name: Quality gate (compile, lint, tests, secret scan, action hygiene)
        env:
          NODETRUST_REQUIRE_LINT: "1"
        run: python scripts/check.py
      - name: SBOM from the fixture repo (no network, no server)
        working-directory: nodetrust-ci/examples/fixture-repo
        run: python ../../src/nodetrust_ci/cli.py sbom --out "$RUNNER_TEMP/sbom.json"
