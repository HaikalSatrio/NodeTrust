name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to full commit SHAs (tags are mutable), looked up 26 Sep 2026. Newer majors exist
      # (checkout v7, setup-python v7); upgrade deliberately, SHA and comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Quality gate (compile, lint, tests, secret scan, dashboard CSP)
        env:
          NODETRUST_REQUIRE_LINT: "1"
        run: python scripts/check.py
