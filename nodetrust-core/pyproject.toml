[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodetrust-core"
version = "0.1.0.dev0"
description = "NodeTrust core: npm dependency graph, exposure, policy and alerting (MVP)"
readme = "README.md"
requires-python = ">=3.11"
# License is a pending team decision (see docs/decisions/NT-001-brian-review.md).
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3.2", "cryptography>=41", "jsonschema[format-nongpl]>=4.18"]  # NT-003 schema/date checks; test TLS certs

[project.scripts]
nodetrust = "nodetrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodetrust = ["dashboard/static/*", "risk/rules/*.json", "contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
